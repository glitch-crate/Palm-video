<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="lib/base.css"><script src="lib/anim.js"></script>
<style>#banner { left: 88px; top: 668px; transform-origin: 0 100%; }</style></head><body>
<div id="banner" class="banner"><div class="ico"><img src="brand/mano-bianca.png"></div>
<div><div class="kw" id="kw"></div><div class="tx" id="tx"></div></div></div>
<script>
// banner.html?k=PAROLA&t=riga1|riga2  — entra a 0,4" e resta fermo (il taglio lo decide il montaggio)
const q = new URLSearchParams(location.search);
kw.textContent = q.get('k'); tx.innerHTML = q.get('t').split('|').join('<br>');
// ancoraggio in basso come il banner REMINDERS
const h = banner.offsetHeight; banner.style.top = (668 + 199 - h) + 'px';
window.seek = t => A.enter(banner, t, .4, { dur: .5, dy: 22, scale: .97 });
</script></body></html>
