<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="lib/base.css"><script src="lib/anim.js"></script>
<style>
  /* Spazio canonico della griglia: celle 7x5, larghezza 700 x altezza 680 unità; S=3 px/unità.
     Origine (0,0) = angolo alto-sinistra della griglia dei giorni; la pagina copre x[-20,720] y[-300,700]. */
  html, body { width: 2220px; height: 3000px; }
  #w { position: absolute; left: 60px; top: 900px; width: 2100px; height: 2040px; }  /* (0,0) canonico */
  .ink { color: rgba(38,38,40,.9); font-family: "PJS"; }
  #head { position: absolute; left: 0; width: 2100px; top: -834px; height: 579px; display: flex; align-items: center; justify-content: center;
          font-weight: 600; font-size: 190px; letter-spacing: .08em; }
  .dn { position: absolute; top: -162px; height: 108px; width: 264px; display: flex; align-items: center; justify-content: center;
        font-weight: 600; font-size: 62px; letter-spacing: .1em; }
  .n { position: absolute; font-weight: 500; font-size: 124px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .sun { color: rgba(176,42,38,.9); }
  .small { font-size: 72px; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style></head><body>
<div id="w" class="ink"></div>
<script>
const S = 3, CW = 100 * S, CH = 136 * S;
const w = document.getElementById('w');
w.insertAdjacentHTML('beforeend', `<div id="head">NOVEMBRE 2026</div>`);
// Novembre 2026 parte dal primo quadrato: l'1 è domenica, quindi la settimana inizia da DOM (1–30 in 5 righe, 6 = venerdì)
const DAYS = ['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
DAYS.forEach((d, i) =>
  w.insertAdjacentHTML('beforeend', `<div class="dn ${i==0?'sun':''}" style="left:${i*CW+18}px">${d}</div>`));
// numeri centrati nel quadrato (riquadro della cella: x+6..x+94, y+6..y+130 unità)
for (let n = 1; n <= 30; n++) {
  const i = (n - 1) % 7, j = Math.floor((n - 1) / 7);
  const x = i * CW + 6 * S, y = j * CH + 6 * S;
  w.insertAdjacentHTML('beforeend', `<div class="n ${i==0?'sun':''}" style="left:${x}px;top:${y}px;width:${88*S}px;height:${124*S}px">${n}</div>`);
}
// Cerchio a mano attorno al 6 (venerdì, 1a riga)
{ const cx = 5 * CW + 50 * S, cy = 0 * CH + 68 * S, rx = 112, ry = 118;   // centro del quadrato del 6
  let d = '';
  for (let k = 0; k <= 64; k++) {           // ellisse imperfetta, chiusura sovrapposta come a penna
    const a = -2.2 + k / 64 * (Math.PI * 2 + .55);
    const wob = 1 + .045 * Math.sin(a * 3 + .7) + .02 * Math.sin(a * 7);
    const x = cx + Math.cos(a) * rx * wob, y = cy + Math.sin(a) * ry * wob * (1 + .04 * (k / 64));
    d += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  w.insertAdjacentHTML('beforeend', `<svg width="2100" height="2040"><path id="circ" d="${d}" fill="none" stroke="rgba(200,32,34,.92)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
}
const circ = document.getElementById('circ'), L = circ.getTotalLength();
circ.style.strokeDasharray = L;
// Il 6 si cerchia: da 0,8" a 1,8" (clip di 4")
window.CIRCLE = { start: 0.8, dur: 1.0 };
window.seek = t => { circ.style.strokeDashoffset = (L * (1 - A.inOutCubic(A.p(t, CIRCLE.start, CIRCLE.dur)))).toFixed(1); };
</script></body></html>
